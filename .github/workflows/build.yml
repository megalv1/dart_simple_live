name: Cloud Build SimpleLive APK

on:
  workflow_dispatch: # 支持网页手动点击运行

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # 1. 签出代码
      - uses: actions/checkout@v4
        with:
          ref: master

      # 2. 设置 JAVA 环境
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      # 3. 设置 Flutter 环境
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 4. 生成空的 key.properties 及空的 dummy.jks 实体文件，防止 Gradle 找不到文件报错
      - name: Create dummy key.properties and keystore
        run: |
          mkdir -p simple_live_app/android/app
          # 生成一个空的 dummy.jks 骗过文件存在性检查
          touch simple_live_app/android/app/dummy.jks
          echo "storeFile=dummy.jks" > simple_live_app/android/key.properties
          echo "storePassword=dummy_password" >> simple_live_app/android/key.properties
          echo "keyPassword=dummy_password" >> simple_live_app/android/key.properties
          echo "keyAlias=dummy_alias" >> simple_live_app/android/key.properties

      # 5. 更新 Flutter packages
      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      # 6. 打包 APK（使用 debug 签名跳过秘钥校验，打包出可安装的 Release 包）
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --debug --split-per-abi

      # 7. 上传 APK 至 Artifacts 供下载
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-Android-APKs
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-debug.apk
