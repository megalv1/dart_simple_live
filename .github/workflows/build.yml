name: Cloud Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Locate Flutter Project Root
        id: locate_project
        run: |
          PROJECT_PATH=$(dirname $(find . -maxdepth 3 -name "pubspec.yaml" | head -n 1))
          echo "Found Flutter project at: $PROJECT_PATH"
          echo "PROJECT_PATH=$PROJECT_PATH" >> $GITHUB_ENV

      - name: Create local.properties & Dummy Key Properties
        run: |
          cd ${{ env.PROJECT_PATH }}
          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties
          echo "flutter.buildMode=release" >> android/local.properties

      - name: Get Dependencies
        run: |
          cd ${{ env.PROJECT_PATH }}
          flutter pub get

      - name: Build Release APK
        run: |
          cd ${{ env.PROJECT_PATH }}
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-APK
          path: ${{ env.PROJECT_PATH }}/build/app/outputs/flutter-apk/app-release.apk
